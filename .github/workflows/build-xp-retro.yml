# Unofficial Files XP Retro build workflow
# Builds a self-signed x64 MSIX package on a Windows GitHub-hosted runner.

name: Build Files XP Retro

on:
  workflow_dispatch:
  push:
    tags:
      - "xp-retro-v*"

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build signed installer package
        shell: pwsh
        run: ./build/Build-XPRetro.ps1 -Architecture x64 -Configuration Release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Files-XP-Retro-4.2.2.2-x64
          path: artifacts/XP-Retro-Package
          if-no-files-found: error
          retention-days: 30
